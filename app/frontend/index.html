<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      #auth-section { margin-bottom: 1.5rem; }
      button { padding: 0.5rem 1rem; cursor: pointer; margin-right: 0.5rem; }
      #status { margin-top: 0.5rem; color: #555; font-size: 0.9rem; }
      #upload-section { margin: 1.5rem 0; display: none; }
      #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
      .photo-card { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
      .photo-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
      .photo-card .info { padding: 0.5rem; font-size: 0.8rem; color: #444; }
      .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
      .badge-pending    { background: #fff3cd; color: #856404; }
      .badge-processed  { background: #d1e7dd; color: #0a3622; }
    </style>
  </head>
  <body>
    <h1>Photo Gallery</h1>

    <div id="auth-section">
      <button id="btn-signin">Sign in</button>
      <button id="btn-signout" style="display:none">Sign out</button>
      <div id="status"></div>
    </div>

    <div id="upload-section">
      <input type="file" id="file-input" accept="image/*" style="display:none" />
      <button id="btn-upload">Upload photo</button>
      <button id="btn-refresh">Refresh gallery</button>
      <div id="upload-status" style="margin-top:0.5rem; color:#555; font-size:0.9rem;"></div>
    </div>

    <div id="gallery"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
