name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pgal-api
          tags: type=sha,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: app/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-aws:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - run: terraform init
      - run: terraform apply -auto-approve

  deploy-azure:
    runs-on: ubuntu-latest
    needs: [build-api, deploy-aws]
    outputs:
      api_url: ${{ steps.tf-outputs.outputs.api_url }}
      static_web_app_url: ${{ steps.tf-outputs.outputs.static_web_app_url }}
    defaults:
      run:
        working-directory: infra/azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - run: terraform init
      - run: terraform apply -auto-approve -var="image_tag=${{ needs.build-api.outputs.image_tag }}"

      - name: Read Terraform outputs
        id: tf-outputs
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "static_web_app_url=$(terraform output -raw static_web_app_url)" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate config.json
        run: |
          cat > app/frontend/public/config.json <<EOF
          {
            "clientId": "${{ vars.ENTRA_CLIENT_ID }}",
            "tenantId": "${{ vars.AZURE_TENANT_ID }}",
            "apiUrl": "${{ needs.deploy-azure.outputs.api_url }}"
          }
          EOF

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Deploy to Static Web Apps
        run: |
          DEPLOY_TOKEN=$(az staticwebapp secrets list \
            --name pgal-frontend \
            --resource-group pgal-rg \
            --query "properties.apiKey" -o tsv)
          npx @azure/static-web-apps-cli deploy app/frontend/dist \
            --deployment-token "$DEPLOY_TOKEN" \
            --env production
